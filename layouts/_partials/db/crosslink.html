{{ $text := .id}}
{{ with .text }}
    {{ $text = . }}
{{ end }}

{{ if hugo.IsDevelopment }}
    <a href="{{ relURL (urls.JoinPath "datenbank" "q" (strings.ToLower .id)) }}">{{ $text }}</a>
{{ else }}
    {{ partial "link.html" (dict "href" (printf "https://db.bienensteff.de/?q=%s" (strings.ToLower .id)) "text" $text) }}
{{ end }}
