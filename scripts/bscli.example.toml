# Config for bscli and the other bstools scripts.
# Copy to bscli.toml in the repository root (kept out of git by .gitignore) or the
# current directory, or to ~/.config/bscli/config.toml -- or point BSCLI_CONFIG /
# `bscli --config` at it.
# Environment variables (GRIST_API_KEY, ...) win over this file.
#
# Every value can be given as <key>_cmd instead: a command whose output is the
# value, run without a shell -- keeps secrets in gopass instead of this file.

[grist]
base_url = "https://docs.getgrist.com"
doc_id = "DOC_ID"
api_key_cmd = ["gopass", "show", "grist-api-key"]

[lexware]
api_key_cmd = ["gopass", "show", "lexware-api-key"]

# The business, for the letterhead and the GiroCode of the typst package
# @local/imkerei (`bscli typst`, the PDF reports). All keys are optional;
# any can be <key>_cmd as well, e.g. iban_cmd = ["gopass", "show", "iban"].
[betrieb]
firma = "Imkerei Max Mustermann"
inhaber = "Max Mustermann"
strasse = "Musterstraße 1"
ort = "12345 Musterstadt"
email = "info@example.org"
telefon = "+49 123 456789"
webseite = "example.org"
kontoinhaber = "Max Mustermann"
iban = "DE00000000000000000000"
bic = "XXXXDEXXXXX"
wero = "https://share.weropay.eu/p/1/c/..."
