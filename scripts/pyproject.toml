[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "bienensteff-scripts"
version = "0.1.0"
description = "Internal data/ops scripts for bienensteff.de -- not published"
requires-python = ">=3.14"
dependencies = [
    "niquests>=3.21",
    "polars>=1.42",
]

[project.scripts]
dump-db = "bstools.cli.dump_db:main"
dump-dwd = "bstools.cli.dump_dwd:main"
dump-trachtnet = "bstools.cli.dump_trachtnet:main"
gen-pricelist = "bstools.cli.gen_pricelist:main"
grist-magic = "bstools.cli.grist_magic:main"
lexware-download = "bstools.cli.lexware_download:main"
lexware-sales-by-article = "bstools.cli.lexware_sales_by_article:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "ty",
]

[tool.mypy]
strict = true
native_parser = true
num_workers = 4

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "bstools"
