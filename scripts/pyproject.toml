[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "bienensteff-scripts"
version = "0.1.0"
description = "Internal data/ops scripts for bienensteff.de -- not published"
requires-python = ">=3.15"
dependencies = [
    "polars>=2",
    "pycurl>=7.48.0",
]

[project.scripts]
bscli = "bstools.cli.bscli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "ty",
    "types-pycurl>=7.48.0.20260923",
]

[tool.mypy]
strict = true
native_parser = true
num_workers = 4

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "bstools"
